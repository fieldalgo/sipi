name: Workbench candidate

on:
  push:
    branches: [codex/independent-repository]
    paths: ['workbench/**', '.github/workflows/workbench-candidate.yml']

permissions:
  contents: read

concurrency:
  group: workbench-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUTF8: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.17'
      - id: pins
        shell: python
        run: |
          import json, os, pathlib
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('engine=' + pathlib.Path('workbench/packaging/engine-ref.txt').read_text().strip() + '\n')
              f.write('shared=' + json.load(open('dependencies.json'))['development_source']['commit'] + '\n')
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: fieldalgo/sipi
          ref: ${{ steps.pins.outputs.engine }}
          path: .validation/engine
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: fieldalgo/openphysics
          ref: ${{ steps.pins.outputs.shared }}
          path: .validation/shared
      - name: Install reviewed runtime and packaging pins
        run: python -m pip install -r workbench/packaging/requirements-windows.txt
      - name: Build and install exact engine wheels
        shell: python
        run: |
          import json, pathlib, subprocess, sys
          root = pathlib.Path.cwd()
          engine = root / '.validation/engine'
          shared = root / '.validation/shared'
          pins = json.loads((engine / 'dependencies.json').read_text())
          actual = subprocess.check_output(['git', '-C', str(shared), 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == pins['development_source']['commit']
          wheels = root / '.validation/wheels'
          wheels.mkdir()
          for source in (shared / 'packages/galerkin', shared / 'packages/meshine', engine):
              subprocess.run([sys.executable, '-m', 'pip', 'wheel', '--no-deps', '--no-build-isolation', '-w', str(wheels), str(source)], check=True)
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', *map(str, wheels.glob('*.whl'))], check=True)
          subprocess.run([sys.executable, '-m', 'pip', 'check'], check=True)
      - name: Windows adapter acceptance
        run: python -m pytest -q workbench/tests --junitxml=.validation/windows-adapter.xml
      - name: Build the single executable
        run: python workbench/packaging/windows.py
      - name: Measure executable startup, calculation, exit and cleanup
        run: python workbench/packaging/smoke.py .validation/sipi-windows/FieldAlgo-SIPI.exe
      # Reports only: no executable, wheel, runtime, deployment or release upload.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: windows-workbench-reports
          retention-days: 14
          include-hidden-files: true
          path: |
            .validation/windows-adapter.xml
            .validation/sipi-windows/inventory.json
            .validation/sipi-windows/build-info.json
            .validation/sipi-windows/smoke.json
            .validation/sipi-windows/notices.txt
            .validation/sipi-windows/compilation.xml
